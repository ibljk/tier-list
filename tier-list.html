<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>从夯到拉 · 分层排行榜</title>
<style>
  :root{
    --bg:#0a0a0c;
    --panel:#141419;
    --panel-2:#101015;
    --line:rgba(255,255,255,.08);
    --line-2:rgba(255,255,255,.13);
    --text:#f2f2f6;
    --muted:#8a8a99;
    --muted-2:#63636f;
    --accent:#5b8cff;
    --radius:12px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    min-height:100vh;
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--text);
    background:
      radial-gradient(1100px 560px at 50% -10%, #232335 0%, rgba(10,10,12,0) 62%),
      radial-gradient(800px 400px at 92% 10%, rgba(91,140,255,.10) 0%, rgba(10,10,12,0) 60%),
      #0a0a0c;
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  button{font-family:inherit}
  ::selection{background:rgba(91,140,255,.35)}

  /* ---------------- 顶栏 ---------------- */
  .topbar{
    position:sticky; top:0; z-index:40;
    display:flex; align-items:center; gap:8px;
    padding:12px 22px;
    background:rgba(9,9,11,.74);
    backdrop-filter:blur(16px) saturate(140%);
    -webkit-backdrop-filter:blur(16px) saturate(140%);
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex; align-items:center; gap:10px; margin-right:6px; user-select:none}
  .mark{
    width:26px; height:26px; border-radius:7px;
    display:grid; place-items:center;
    background:linear-gradient(150deg,#ff7f7f,#ffbf7f 45%,#bfff7f);
    color:#151519; font-weight:900; font-size:14px;
    box-shadow:0 4px 14px -6px #ffbf7f;
  }
  .brand b{font-size:12.5px; letter-spacing:.16em; font-weight:800}
  .brand small{
    display:block; font-size:10px; letter-spacing:.22em; font-weight:600;
    color:var(--muted-2); margin-top:2px;
  }
  .spacer{flex:1}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:7px;
    height:34px; padding:0 13px; border-radius:9px;
    border:1px solid var(--line-2);
    background:#1b1b22; color:#d9d9e2;
    font-size:13px; font-weight:600; letter-spacing:.01em;
    cursor:pointer; white-space:nowrap;
    transition:background .16s, border-color .16s, color .16s, transform .12s, box-shadow .16s;
  }
  .btn:hover{background:#25252e; border-color:rgba(255,255,255,.2); color:#fff}
  .btn:active{transform:translateY(1px)}
  .btn svg{flex:0 0 auto; opacity:.85}
  .btn.ghost{background:transparent; border-color:transparent; color:var(--muted)}
  .btn.ghost:hover{background:#1b1b22; color:#fff; border-color:var(--line)}
  .btn.primary{
    background:linear-gradient(180deg,#6d95ff,#4a76f0);
    border-color:#4a76f0; color:#fff;
    box-shadow:0 8px 20px -10px #4a76f0;
  }
  .btn.primary:hover{filter:brightness(1.08); border-color:#6d95ff}
  .btn:disabled{opacity:.55; cursor:default}

  /* ---------------- 舞台 ---------------- */
  .stage{padding:30px 22px 90px; display:flex; justify-content:center}
  .board{width:100%; max-width:1040px}

  .board-title{
    margin:0 0 6px; padding:4px 6px;
    font-size:clamp(22px,2.6vw,31px); font-weight:800; letter-spacing:-.02em;
    line-height:1.25; outline:none; border-radius:8px;
    transition:background .18s, box-shadow .18s;
  }
  .board-title:focus{background:#15151c; box-shadow:0 0 0 1px var(--line-2)}
  .board-title:empty::before{content:"未命名排行榜"; color:#4c4c58}

  .board-sub{
    margin:0 0 18px; padding:0 6px;
    color:var(--muted-2); font-size:12.5px; line-height:1.7;
  }
  .board-sub kbd{
    font-family:inherit; font-size:11px;
    background:#1b1b22; border:1px solid var(--line-2);
    border-bottom-width:2px; border-radius:5px; padding:1px 5px; color:#b9b9c6;
  }
  .board-sub a{
    color:#7f9dff; text-decoration:none; border-bottom:1px dashed rgba(127,157,255,.45);
    cursor:pointer; transition:.15s;
  }
  .board-sub a:hover{color:#a9bcff; border-bottom-color:#a9bcff}

  /* ---------------- 分层 ---------------- */
  .tiers{
    display:flex; flex-direction:column; gap:5px;
    padding:5px; border-radius:16px;
    background:#0d0d11;
    border:1px solid var(--line);
    box-shadow:0 30px 70px -40px #000, inset 0 1px 0 rgba(255,255,255,.03);
  }
  .tier{
    display:grid; grid-template-columns:112px minmax(0,1fr) 40px;
    min-height:96px; border-radius:9px; overflow:hidden;
    background:#131319;
    transition:box-shadow .18s;
    position:relative;
  }
  .tier:hover{box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}

  .tier-label{
    display:flex; align-items:center; justify-content:center; text-align:center;
    padding:8px 8px; overflow:hidden;
    background:linear-gradient(160deg, var(--c), var(--c2));
    color:var(--ink,#141418);
    font-size:clamp(16px,2.1vw,26px); font-weight:800; letter-spacing:.01em; line-height:1.15;
    word-break:break-word; outline:none; cursor:text;
    transition:filter .18s;
  }
  .tier-label:hover{filter:brightness(1.05)}
  .tier-label:focus{box-shadow:inset 0 0 0 2px rgba(0,0,0,.35)}

  .items{
    display:flex; flex-wrap:wrap; align-content:flex-start; gap:10px;
    padding:12px; min-height:96px; min-width:0;
    transition:background .15s, box-shadow .15s;
  }
  .dropzone.over{background:rgba(91,140,255,.07); box-shadow:inset 0 0 0 2px rgba(91,140,255,.55)}
  .dropzone.over-file{background:rgba(91,140,255,.1); box-shadow:inset 0 0 0 2px var(--accent)}
  .tier.over-file{box-shadow:inset 0 0 0 2px var(--accent)}
  .empty-hint{
    align-self:center; margin-right:2px;
    color:#5d5d6c; font-size:12.5px; letter-spacing:.02em;
    user-select:none; pointer-events:none;
    animation:fadein .3s ease both;
  }
  @keyframes fadein{from{opacity:0} to{opacity:1}}

  .item{
    position:relative; width:92px; height:92px; border-radius:10px; overflow:hidden;
    background:#1d1d25; cursor:grab;
    box-shadow:0 3px 12px -6px #000;
    transition:transform .14s, box-shadow .14s, opacity .14s;
    animation:pop .22s ease both;
  }
  @keyframes pop{from{transform:scale(.9); opacity:0} to{transform:scale(1); opacity:1}}
  .item img{width:100%; height:100%; object-fit:cover; display:block; pointer-events:none}
  .item:hover{transform:translateY(-2px); box-shadow:0 12px 26px -12px #000; z-index:2}
  .item.dragging{opacity:.4; transform:scale(.95); cursor:grabbing}
  .item-del{
    position:absolute; top:3px; right:3px; width:20px; height:20px;
    display:grid; place-items:center; padding:0;
    border:0; border-radius:50%; cursor:pointer;
    background:rgba(8,8,10,.82); color:#fff; font-size:14px; line-height:1;
    opacity:0; transform:scale(.8); transition:.15s;
    backdrop-filter:blur(4px);
  }
  .item:hover .item-del{opacity:1; transform:scale(1)}
  .item-del:hover{background:#ff5757}

  .add-card{
    width:92px; height:92px; padding:0; border-radius:10px;
    border:1px dashed rgba(255,255,255,.16);
    background:rgba(255,255,255,.012);
    color:#5f5f6d; cursor:pointer;
    display:grid; place-items:center;
    transition:.18s;
  }
  .add-card:hover{
    border-color:rgba(91,140,255,.7); color:#8fb0ff;
    background:rgba(91,140,255,.08);
  }

  .tier-ctrl{
    display:grid; grid-template-rows:repeat(4,1fr); align-items:center; justify-items:center;
    padding:3px 2px; background:#101016; border-left:1px solid rgba(255,255,255,.045);
    opacity:.3; transition:opacity .18s;
  }
  .tier:hover .tier-ctrl, .tier:focus-within .tier-ctrl{opacity:1}
  .icon-btn{
    width:26px; height:22px; display:grid; place-items:center; padding:0;
    border:0; border-radius:6px; background:transparent; color:#b9b9c6; cursor:pointer;
    transition:.14s;
  }
  .icon-btn:hover{background:#282832; color:#fff}
  .icon-btn:disabled{opacity:.22; cursor:default; background:transparent; color:#b9b9c6}
  .icon-btn.danger:hover{background:#3a1e24; color:#ff8b8b}

  /* ---------------- 未分类池 ---------------- */
  .pool{
    position:relative; margin-top:14px; padding:5px;
    display:flex; align-items:stretch;
    min-height:118px; border-radius:14px;
    background:rgba(13,13,17,.7);
    border:1px dashed rgba(255,255,255,.14);
    transition:border-color .2s, background .2s;
  }
  .pool.dropzone.over-file{border-color:var(--accent); background:rgba(91,140,255,.08)}
  .pool-label{
    flex:0 0 112px; width:112px;
    display:flex; align-items:center; justify-content:center;
    border-radius:9px; background:#141419;
    color:#6d6d7c; font-size:12px; font-weight:800; letter-spacing:.2em;
  }
  #poolItems{flex:1; min-width:0}
  .pool-empty{
    position:absolute; inset:0; display:flex; flex-direction:column; gap:5px;
    align-items:center; justify-content:center; text-align:center;
    pointer-events:none; color:#5b5b69; font-size:12.5px;
  }
  .pool-empty strong{font-size:13.5px; color:#82828f; font-weight:600}

  /* ---------------- 颜色气泡 ---------------- */
  .popover{
    position:fixed; z-index:80; width:206px; padding:12px;
    border-radius:12px; border:1px solid var(--line-2);
    background:#1a1a22;
    box-shadow:0 30px 60px -20px #000, 0 0 0 1px rgba(0,0,0,.4);
    animation:pop .14s ease both;
  }
  .pop-title{font-size:11px; font-weight:700; letter-spacing:.1em; color:var(--muted-2); margin:0 0 9px 2px}
  .swatches{display:grid; grid-template-columns:repeat(6,1fr); gap:6px}
  .swatch{
    aspect-ratio:1; border-radius:6px; border:2px solid transparent; padding:0;
    cursor:pointer; transition:transform .12s, border-color .12s;
  }
  .swatch:hover{transform:scale(1.12); border-color:rgba(255,255,255,.65)}
  .swatch.active{border-color:#fff}
  .custom-row{
    display:flex; align-items:center; gap:8px; margin-top:10px; padding-top:10px;
    border-top:1px solid var(--line); font-size:12px; color:var(--muted);
  }
  .custom-row input[type=color]{
    margin-left:auto; width:32px; height:24px; padding:0;
    border:1px solid var(--line-2); border-radius:6px; background:#101015; cursor:pointer;
  }

  /* ---------------- 演示模式 ---------------- */
  .exit-present{display:none; position:fixed; right:22px; bottom:22px; z-index:90}
  body.present .topbar,
  body.present .pool,
  body.present .board-sub,
  body.present .tier-ctrl,
  body.present .add-card{display:none}
  body.present .exit-present{display:inline-flex}
  body.present .stage{padding:44px 32px; align-items:center}
  body.present .board{max-width:1200px}
  body.present .tiers{border:0; background:transparent; box-shadow:none; padding:0; gap:8px}
  body.present .tier{grid-template-columns:118px minmax(0,1fr); background:#15151b}
  body.present .item{cursor:default}
  body.present .item-del{display:none}

  /* ---------------- 浮层 ---------------- */
  .toast{
    position:fixed; left:50%; bottom:26px; z-index:120;
    padding:10px 16px; border-radius:10px;
    background:#20202a; border:1px solid var(--line-2); color:#ededf3;
    font-size:12.5px; box-shadow:0 24px 50px -22px #000;
    opacity:0; transform:translate(-50%,14px); pointer-events:none;
    transition:opacity .24s, transform .24s;
    max-width:80vw;
  }
  .toast.show{opacity:1; transform:translate(-50%,0)}

  @media (max-width:720px){
    .topbar{flex-wrap:wrap; padding:10px 14px; gap:6px}
    .brand small{display:none}
    .btn{height:32px; padding:0 10px; font-size:12px}
    .stage{padding:20px 12px 70px}
    .tier{grid-template-columns:76px minmax(0,1fr) 34px}
    .tier-ctrl{grid-template-rows:repeat(4,1fr)}
    .items{padding:10px; gap:8px}
    .item,.add-card{width:74px; height:74px}
    .pool{grid-template-columns:76px minmax(0,1fr)}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="mark">T</span>
    <b>TIER LIST<small>从夯到拉</small></b>
  </div>
  <div class="spacer"></div>
  <button class="btn" id="btnUpload"></button>
  <button class="btn" id="btnAddTier"></button>
  <button class="btn ghost" id="btnPresent"></button>
  <button class="btn ghost" id="btnReset"></button>
  <button class="btn primary" id="btnDownload"></button>
</header>

<main class="stage">
  <section class="board">
    <h1 class="board-title" id="title" contenteditable="true" spellcheck="false">从夯到拉 · 我的排行榜</h1>
    <p class="board-sub">
      把图片拖进任意分层即可排名，拖回下方「未分类」可取消归类。点左侧色块文字直接改名，
      <kbd>Ctrl</kbd>+<kbd>V</kbd> 可直接粘贴截图，<a href="#" id="demoLink">先看看示例</a>。
    </p>

    <div class="tiers" id="tiers"></div>

    <div class="pool" id="pool">
      <div class="pool-label">未分类</div>
      <div class="items dropzone" id="poolItems"></div>
      <div class="pool-empty" id="poolEmpty">
        <strong>把图片拖到这里</strong>
        <span>或点击右上角「上传图片」，也可以直接粘贴截图</span>
      </div>
    </div>
  </section>
</main>

<button class="btn exit-present" id="exitPresent">退出演示 · Esc</button>
<div class="popover" id="popover" hidden></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileInput" accept="image/*" multiple hidden />

<script>
(function () {
  "use strict";

  /* ===================== 基础工具 ===================== */
  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
  const uid = () => Math.random().toString(36).slice(2, 10);
  const FONT = '"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif';

  const ICONS = {
    upload: '<path d="M12 16.5V4.5"/><path d="M7.2 9.3 12 4.5l4.8 4.8"/><path d="M4 16v2.6A1.4 1.4 0 0 0 5.4 20h13.2a1.4 1.4 0 0 0 1.4-1.4V16"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    download: '<path d="M12 4v11.5"/><path d="m7.2 10.7 4.8 4.8 4.8-4.8"/><path d="M4.5 17.5V19a1.4 1.4 0 0 0 1.4 1.4h12.2a1.4 1.4 0 0 0 1.4-1.4v-1.5"/>',
    eye: '<path d="M2.2 12S5.7 5.9 12 5.9 21.8 12 21.8 12 18.3 18.1 12 18.1 2.2 12 2.2 12Z"/><circle cx="12" cy="12" r="2.7"/>',
    trash: '<path d="M4 7h16"/><path d="M9.5 7V4.8h5V7"/><path d="M6.6 7l.8 12.1A1.9 1.9 0 0 0 9.3 21h5.4a1.9 1.9 0 0 0 1.9-1.9L17.4 7"/>',
    up: '<path d="m6 14 6-6 6 6"/>',
    down: '<path d="m6 10 6 6 6-6"/>',
    palette: '<circle cx="12" cy="12" r="8"/><circle cx="9.2" cy="9.8" r="1.15" fill="currentColor" stroke="none"/><circle cx="14.8" cy="9.8" r="1.15" fill="currentColor" stroke="none"/><circle cx="12" cy="14.6" r="1.15" fill="currentColor" stroke="none"/>',
    reset: '<path d="M4.2 12a7.8 7.8 0 1 1 2.3 5.5"/><path d="M4 4.8V10h5.2"/>'
  };
  function icon(name, size) {
    const s = size || 15;
    return '<svg viewBox="0 0 24 24" width="' + s + '" height="' + s + '" fill="none" stroke="currentColor" ' +
      'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + (ICONS[name] || "") + '</svg>';
  }

  const PALETTE = [
    "#ff7f7f", "#ff9f7f", "#ffbf7f", "#ffdf7f", "#e9ff7f", "#bfff7f",
    "#7fff9f", "#7fffd4", "#7fdfff", "#7fbfff", "#a58cff", "#e07fff",
    "#ff7fd0", "#d9d9e2", "#9a9aa8", "#5c5c6b"
  ];
  const DEFAULT_TIERS = [
    { label: "S", color: "#ff7f7f" },
    { label: "A", color: "#ffbf7f" },
    { label: "B", color: "#ffdf7f" },
    { label: "C", color: "#bfff7f" },
    { label: "D", color: "#7fff9f" }
  ];
  const STORE_KEY = "tierlist.v1";

  /* ===================== 状态 ===================== */
  const images = new Map(); // id -> { src, name }
  let state = null;
  let dragEl = null;
  let saveTimer = null;

  function freshState() {
    return {
      title: "从夯到拉 · 我的排行榜",
      tiers: DEFAULT_TIERS.map(t => ({ id: uid(), label: t.label, color: t.color, items: [] })),
      pool: []
    };
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (!raw) return null;
      const data = JSON.parse(raw);
      if (!data || !Array.isArray(data.tiers)) return null;
      (data.imgs || []).forEach(rec => { if (rec && rec.id && rec.src) images.set(rec.id, { src: rec.src, name: "" }); });
      const clean = arr => (arr || []).filter(id => images.has(id));
      return {
        title: data.title || "我的排行榜",
        tiers: data.tiers.map(t => ({
          id: t.id || uid(),
          label: t.label || "",
          color: t.color || "#9a9aa8",
          items: clean(t.items)
        })),
        pool: clean(data.pool)
      };
    } catch (err) {
      console.warn("读取本地存档失败", err);
      return null;
    }
  }

  function save() {
    clearTimeout(saveTimer);
    try {
      const used = new Set();
      state.tiers.forEach(t => t.items.forEach(id => used.add(id)));
      state.pool.forEach(id => used.add(id));
      const imgs = [];
      used.forEach(id => {
        const rec = images.get(id);
        if (rec) imgs.push({ id: id, src: rec.src });
      });
      localStorage.setItem(STORE_KEY, JSON.stringify({
        title: state.title, tiers: state.tiers, pool: state.pool, imgs: imgs
      }));
    } catch (err) {
      toast("本地空间不足，本次修改未自动保存");
    }
  }
  function saveSoon() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(save, 400);
  }

  /* ===================== 颜色计算 ===================== */
  function hexToRgb(hex) {
    let h = (hex || "#888888").replace("#", "");
    if (h.length === 3) h = h.split("").map(c => c + c).join("");
    const n = parseInt(h, 16);
    return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
  }
  function toHex(r, g, b) {
    const f = v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, "0");
    return "#" + f(r) + f(g) + f(b);
  }
  function shade(hex, amt) {
    const c = hexToRgb(hex);
    return toHex(c.r + amt, c.g + amt, c.b + amt);
  }
  function ink(hex) {
    const c = hexToRgb(hex);
    const L = (0.299 * c.r + 0.587 * c.g + 0.114 * c.b) / 255;
    return L > 0.62 ? "#141418" : "#ffffff";
  }

  /* ===================== 元素引用 ===================== */
  const tiersEl = $("#tiers");
  const poolEl = $("#pool");
  const poolItems = $("#poolItems");
  const poolEmpty = $("#poolEmpty");
  const titleEl = $("#title");
  const popover = $("#popover");
  const toastEl = $("#toast");
  const fileInput = $("#fileInput");

  /* ===================== 提示条 ===================== */
  let toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2200);
  }

  /* ===================== 渲染 ===================== */
  function makeItem(id) {
    const rec = images.get(id);
    const el = document.createElement("div");
    el.className = "item";
    el.draggable = true;
    el.dataset.id = id;
    const img = document.createElement("img");
    img.alt = "";
    img.draggable = false;
    img.src = rec ? rec.src : "";
    const del = document.createElement("button");
    del.className = "item-del";
    del.type = "button";
    del.dataset.del = id;
    del.title = "移除";
    del.textContent = "×";
    el.append(img, del);
    return el;
  }

  function makeAddCard(tierId) {
    const b = document.createElement("button");
    b.className = "add-card";
    b.type = "button";
    b.dataset.add = tierId || "pool";
    b.title = "往这一格添加图片";
    b.innerHTML = icon("plus", 20);
    return b;
  }

  function iconBtn(name, tip, onClick, disabled, danger) {
    const b = document.createElement("button");
    b.className = "icon-btn" + (danger ? " danger" : "");
    b.type = "button";
    b.title = tip;
    b.disabled = !!disabled;
    b.innerHTML = icon(name, 15);
    b.addEventListener("click", onClick);
    return b;
  }

  function renderTier(tier, index) {
    const row = document.createElement("div");
    row.className = "tier";
    row.dataset.id = tier.id;

    if (state.tiers.length <= 1) { toast("至少保留一个分层"); return; }
    const i = state.tiers.findIndex(t => t.id === id);
    if (i < 0) return;

    state.pool.unshift.apply(state.pool, tier.items);

    save();

  /* ===================== 图片导入 ===================== */
  function compress(file, max) {
    const limit = max || 300;
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = reject;
      reader.onload = () => {
        const img = new Image();
        img.onerror = reject;
        img.onload = () => {
          const w0 = img.naturalWidth || img.width;
          const h0 = img.naturalHeight || img.height;
          const scale = Math.min(1, limit / Math.max(w0, h0));
          const w = Math.max(1, Math.round(w0 * scale));
          const h = Math.max(1, Math.round(h0 * scale));
          const canvas = document.createElement("canvas");
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = "high";
          ctx.drawImage(img, 0, 0, w, h);
          let src = "";
          try { src = canvas.toDataURL("image/webp", 0.9); } catch (e) { src = ""; }
          if (!src || src.indexOf("data:image/webp") !== 0) {
            try { src = canvas.toDataURL("image/png"); } catch (e) { src = reader.result; }
          }
          resolve({ src: src, name: file.name || "" });
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  async function addFiles(files, target) {
    const list = Array.from(files).filter(f => f && f.type && f.type.indexOf("image/") === 0);
    if (!list.length) { toast("只支持图片文件"); return; }
    const ids = [];
    for (let i = 0; i < list.length; i++) {
      try {
        const rec = await compress(list[i]);
        const id = uid();
        images.set(id, rec);
        ids.push(id);
      } catch (err) {
        console.warn("图片处理失败", list[i].name, err);
      }
    }
    if (!ids.length) { toast("图片读取失败"); return; }
    if (target && target !== "pool") {
      const tier = state.tiers.find(t => t.id === target);
      if (tier) tier.items.push.apply(tier.items, ids);
      else state.pool.push.apply(state.pool, ids);
    } else {
      state.pool.push.apply(state.pool, ids);
    }
    render();
    save();
    toast("已添加 " + ids.length + " 张图片");
  }

  /* ===================== 拖拽排序 ===================== */
  function findRef(zone, x, y) {
    const items = $$(":scope > .item", zone).filter(el => el !== dragEl);
    for (let i = 0; i < items.length; i++) {
      const r = items[i].getBoundingClientRect();
      if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) {
        return x < r.left + r.width / 2 ? items[i] : items[i].nextElementSibling;
      }
    }
    let best = null;
    let bestD = Infinity;
    for (let i = 0; i < items.length; i++) {
      const r = items[i].getBoundingClientRect();
      const d = Math.hypot(x - (r.left + r.width / 2), y - (r.top + r.height / 2));
      if (d < bestD) { bestD = d; best = items[i]; }
    }
    if (!best) return null;
    const br = best.getBoundingClientRect();
    return y < br.top ? best : best.nextElementSibling;
  }

    if (isFile) {

      dt.dropEffect = "copy";

    if (!dragEl) return;
    const zone = e.target.closest(".dropzone");
    if (!zone) {
      $$(".dropzone").forEach(z => z.classList.remove("over"));
      return;
    }
    e.preventDefault();
    dt.dropEffect = "move";
    $$(".dropzone").forEach(z => z.classList.toggle("over", z === zone));

    const ref = findRef(zone, e.clientX, e.clientY);
    const addCard = zone.querySelector(":scope > .add-card");
    if (ref) {
      if (ref !== dragEl && ref !== dragEl.nextElementSibling) zone.insertBefore(dragEl, ref);
    } else if (addCard) {
      if (dragEl.nextElementSibling !== addCard) zone.insertBefore(dragEl, addCard);
    } else if (zone.lastElementChild !== dragEl) {
      zone.appendChild(dragEl);

  });

  /* ===================== 导出 PNG ===================== */
  function rr(ctx, x, y, w, h, r) {
    const rad = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rad, y);
    ctx.arcTo(x + w, y, x + w, y + h, rad);
    ctx.arcTo(x + w, y + h, x, y + h, rad);
    ctx.arcTo(x, y + h, x, y, rad);
    ctx.arcTo(x, y, x + w, y, rad);
    ctx.closePath();
  }

  function drawCover(ctx, img, x, y, w, h, r) {
    ctx.save();
    rr(ctx, x, y, w, h, r);
    ctx.clip();
    const iw = img.naturalWidth || img.width;
    const ih = img.naturalHeight || img.height;
    const s = Math.max(w / iw, h / ih);
    const dw = iw * s;
    const dh = ih * s;
    ctx.drawImage(img, x + (w - dw) / 2, y + (h - dh) / 2, dw, dh);
    ctx.restore();
  }

  async function buildCanvas() {
    const W = 1000;
    const LABEL_W = 116;
    const PAD = 16;
    const GAP = 10;
    const SIZE = 94;
    const INSET = 8;
    const ROW_GAP = 5;
    const TITLE_H = 104;

    const groups = state.tiers.map(t => ({
      label: t.label || " ", color: t.color, ids: t.items.slice()
    }));
    if (state.pool.length) {
      groups.push({ label: "未分类", color: "#34343f", ids: state.pool.slice() });
    }
    if (!groups.length) throw new Error("没有可导出的分层");

    const contentW = W - LABEL_W - PAD * 2 - INSET * 2;
    const perRow = Math.max(1, Math.floor((contentW + GAP) / (SIZE + GAP)));

    const rowH = groups.map(g => {
      if (!g.ids.length) return 86;
      const lines = Math.max(1, Math.ceil(g.ids.length / perRow));
      return Math.max(SIZE + PAD * 2, lines * SIZE + (lines - 1) * GAP + PAD * 2);
    });
    const totalRows = rowH.reduce((a, b) => a + b, 0) + ROW_GAP * Math.max(0, groups.length - 1);
    const H = TITLE_H + totalRows + 20;

    // 预加载图片
    const imgs = new Map();
    await Promise.all(groups.flatMap(g => g.ids).map(id => new Promise(resolve => {
      const rec = images.get(id);
      if (!rec) return resolve();
      const im = new Image();
      im.onload = () => { imgs.set(id, im); resolve(); };
      im.onerror = () => resolve();
      im.src = rec.src;
    })));

    const scale = H * 2 > 12000 ? Math.max(1, 12000 / H) : 2;
    const canvas = document.createElement("canvas");
    canvas.width = Math.round(W * scale);
    canvas.height = Math.round(H * scale);
    const ctx = canvas.getContext("2d");
    ctx.scale(scale, scale);

    // 底板
    rr(ctx, 0, 0, W, H, 22);
    ctx.fillStyle = "#0b0b0e";
    ctx.fill();
    ctx.save();
    rr(ctx, 0, 0, W, H, 22);
    ctx.clip();

    // 顶部吸附光
    const glow = ctx.createRadialGradient(W * 0.5, -120, 40, W * 0.5, -120, 560);
    glow.addColorStop(0, "rgba(120,140,255,.16)");
    glow.addColorStop(1, "rgba(11,11,14,0)");
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, 320);

    // 标题
    ctx.textBaseline = "middle";
    ctx.textAlign = "left";
    let titleSize = 32;
    ctx.font = "800 " + titleSize + "px " + FONT;
    while (ctx.measureText(state.title).width > W - 220 && titleSize > 16) {
      titleSize -= 1;
      ctx.font = "800 " + titleSize + "px " + FONT;
    }
    ctx.fillStyle = "#f4f4f8";
    ctx.fillText(state.title, 24, 52);

    ctx.textAlign = "right";
    ctx.font = "700 11px " + FONT;
    ctx.fillStyle = "#5a5a68";
    ctx.fillText("T I E R   L I S T", W - 24, 52);

    ctx.textAlign = "left";
    ctx.font = "600 12px " + FONT;
    ctx.fillStyle = "#6b6b7a";
    const total = groups.reduce((a, g) => a + g.ids.length, 0);
    ctx.fillText("从夯到拉 · " + total + " 张 · " + new Date().toLocaleDateString("zh-CN"), 24, 78);

    // 分层
    let y = TITLE_H;
    const x0 = INSET;
    const x1 = W - INSET;

    groups.forEach((g, gi) => {
      const h = rowH[gi];

      rr(ctx, x0, y, x1 - x0, h, 9);
      ctx.fillStyle = "#15151b";
      ctx.fill();

      // 左侧色块
      ctx.save();
      rr(ctx, x0, y, x1 - x0, h, 9);
      ctx.clip();
      const lg = ctx.createLinearGradient(x0, y, x0 + LABEL_W, y + h);
      lg.addColorStop(0, g.color);
      lg.addColorStop(1, shade(g.color, -18));
      ctx.fillStyle = lg;
      ctx.fillRect(x0, y, LABEL_W, h);
      ctx.restore();

      // 层名
      let ls = 26;
      ctx.font = "800 " + ls + "px " + FONT;
      while (ctx.measureText(g.label).width > LABEL_W - 18 && ls > 10) {
        ls -= 1;
        ctx.font = "800 " + ls + "px " + FONT;
      }
      ctx.fillStyle = ink(g.color);
      ctx.textAlign = "center";
      ctx.fillText(g.label, x0 + LABEL_W / 2, y + h / 2 + 1);
      ctx.textAlign = "left";

      // 图片
      g.ids.forEach((id, i) => {
        const line = Math.floor(i / perRow);
        const col = i % perRow;
        const ix = x0 + LABEL_W + PAD + col * (SIZE + GAP);
        const iy = y + PAD + line * (SIZE + GAP);
        const im = imgs.get(id);
        ctx.save();
        rr(ctx, ix, iy, SIZE, SIZE, 10);
        ctx.fillStyle = "#1e1e26";
        ctx.fill();
        ctx.restore();
        if (im) {
          drawCover(ctx, im, ix, iy, SIZE, SIZE, 10);
          ctx.save();
          rr(ctx, ix + 0.5, iy + 0.5, SIZE - 1, SIZE - 1, 10);
          ctx.strokeStyle = "rgba(255,255,255,.09)";
          ctx.lineWidth = 1;
          ctx.stroke();
          ctx.restore();
        }
      });

      y += h + ROW_GAP;
    });

    ctx.restore();
    return canvas;
  }

  async function exportPNG() {
    const btn = $("#btnDownload");
    const old = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span>正在生成…</span>';
    try {
      const canvas = await buildCanvas();
      const blob = await new Promise(res => canvas.toBlob(res, "image/png"));
      if (!blob) throw new Error("画布导出失败");
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = (state.title || "tier-list").replace(/[\\/:*?"<>|]/g, "").slice(0, 40) + ".png";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
      toast("已导出 PNG");
    } catch (err) {
      console.error(err);
      toast("导出失败：" + (err.message || err));
    } finally {
      btn.disabled = false;
      btn.innerHTML = old;
    }
  }

  /* ===================== 示例数据 ===================== */
  const DEMO_SET = [
    ["\uD83D\uDD25", 8], ["\uD83C\uDF5C", 24], ["\uD83C\uDFAE", 212], ["\uD83C\uDFA7", 258],
    ["\uD83C\uDF08", 188], ["\uD83D\uDC31", 42], ["\uD83D\uDE80", 282], ["\uD83C\uDF70", 332]
  ];

  function demoCanvas(emoji, hue) {
    const c = document.createElement("canvas");
    c.width = c.height = 240;
    const ctx = c.getContext("2d");
    const g = ctx.createLinearGradient(0, 0, 240, 240);
    g.addColorStop(0, "hsl(" + hue + ",62%,58%)");
    g.addColorStop(1, "hsl(" + ((hue + 48) % 360) + ",58%,38%)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 240, 240);
    ctx.font = '128px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(emoji, 120, 130);
    return c.toDataURL("image/png");
  }

  function loadDemo() {
    let k = 0;
    state.tiers.forEach((tier, i) => {
      const take = i <= 2 ? 2 : 1;
      for (let n = 0; n < take && k < DEMO_SET.length; n++, k++) {
        const id = uid();
        images.set(id, { src: demoCanvas(DEMO_SET[k][0], DEMO_SET[k][1]), name: "" });
        tier.items.push(id);
      }
    });
    while (k < DEMO_SET.length) {
      const id = uid();
      images.set(id, { src: demoCanvas(DEMO_SET[k][0], DEMO_SET[k][1]), name: "" });
      state.pool.push(id);
      k++;
    }
    render();
    save();
  }

  const demoLink = $("#demoLink");
  if (demoLink) {
    demoLink.addEventListener("click", e => {
      e.preventDefault();
      const used = state.pool.length + state.tiers.reduce((a, t) => a + t.items.length, 0);
      if (used) { toast("先「重置」清空，再看示例"); return; }
      loadDemo();
      toast("已填充示例图片，试着拖一拖");
    });
  }

  /* ===================== 启动 ===================== */
  state = loadState() || freshState();
  render();
  if (!state.tiers.length) addTier();
  if (/[?&]demo\b/.test(location.search)) loadDemo();
})();
</script>
</body>
</html>
